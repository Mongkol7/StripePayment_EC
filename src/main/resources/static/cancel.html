<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled | StripePay EC</title>
  <meta name="description" content="Payment was cancelled. No charges were incurred on your card.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Background Animated Liquid Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Apple Dynamic Island Floating Navigation Dock -->
  <header class="app-header">
    <a href="/" class="brand-wrap">
      <div class="brand-icon" style="background: linear-gradient(135deg, var(--ios-red) 0%, #be123c 100%); box-shadow: 0 4px 14px rgba(255, 69, 58, 0.4);">✕</div>
      <div>
        <span class="brand-text">StripePay EC</span>
        <span class="brand-tag" style="color: var(--ios-red); border-color: rgba(255, 69, 58, 0.3); background: rgba(255, 69, 58, 0.12);">STATUS</span>
      </div>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link">
        <span>🏠</span> Home
      </a>
      <a href="/orders.html" class="nav-link">
        <span>📦</span> Orders
      </a>
    </nav>

    <div class="nav-actions">
      <a href="/" class="btn-preset" style="text-decoration: none; padding: 0.45rem 1rem; font-size: 0.86rem; font-weight: 600;">
        <span>🛍️</span> Store Home
      </a>
    </div>
  </header>

  <main class="checkout-wrapper" style="margin: 2rem auto; padding: 0 1rem;">
    <div class="glass-card">
      
      <div class="cancel-icon-wrap">
        ✕
      </div>

      <div class="card-header">
        <h1 class="card-title" style="color: var(--ios-red); font-size: 2rem; margin-bottom: 0.35rem;">Payment Cancelled</h1>
        <p class="card-subtitle">Your transaction was not completed. No charges were made to your account.</p>
      </div>

      <div class="receipt-box">
        <div class="receipt-row">
          <span>Status</span>
          <span class="val"><span class="status-badge status-cancelled">CANCELLED</span></span>
        </div>
        <div class="receipt-row">
          <span>Order Reference</span>
          <span class="val" id="cancelOrderRef" style="font-family: 'JetBrains Mono', monospace; color: var(--ios-blue);">-</span>
        </div>
        <div class="receipt-row">
          <span>Reason</span>
          <span class="val" style="color: var(--ios-label-tertiary);">Session expired or cancelled by customer</span>
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
        <a href="/" class="btn-stripe-pay" style="width: 100%; text-decoration: none; text-align: center;">
          <span>Return to Store & Try Again</span>
        </a>
      </div>

    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderRef = urlParams.get('order_ref');

      if (orderRef) {
        document.getElementById('cancelOrderRef').textContent = orderRef;
        try {
          await fetch(`/api/v1/payments/cancel/${orderRef}`, { method: 'POST' });
        } catch (e) {
          console.warn('Could not notify cancellation:', e);
        }
      }
    });
  </script>

</body>
</html>
