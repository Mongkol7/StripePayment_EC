<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Invoices | StripePay EC Apple iOS 27</title>
  <meta name="description" content="Lookup your past orders, view payment status (COMPLETED, PENDING, CANCELLED), and download official PDF tax invoices.">
  <link rel="stylesheet" href="css/style.css">
  <!-- html2pdf.js for instant receipt PDF downloading from orders page -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <!-- Background Animated Liquid Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Apple Dynamic Island Floating Navigation Dock -->
  <header class="app-header">
    <a href="/" class="brand-wrap">
      <div class="brand-icon">⚡</div>
      <div>
        <span class="brand-text">StripePay EC</span>
        <span class="brand-tag">ORDERS</span>
      </div>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link">
        <span>📚</span> Catalog
      </a>
      <a href="/orders.html" class="nav-link active">
        <span>📦</span> Orders
      </a>
    </nav>

    <div class="nav-actions">
      <!-- Apple Segmented Currency Switcher -->
      <div class="currency-switcher">
        <button type="button" class="currency-btn active" data-currency="USD" id="btnCurrUSD">$ USD</button>
        <button type="button" class="currency-btn" data-currency="KHR" id="btnCurrKHR">៛ KHR</button>
      </div>

      <a href="/" class="btn-preset" style="text-decoration: none; padding: 0.45rem 1rem; font-size: 0.86rem; font-weight: 600;">
        <span>🛍️</span> Store
      </a>
    </div>
  </header>

  <!-- Orders Page Content -->
  <main class="orders-page-wrapper">
    
    <!-- Search / Lookup Header Card (Apple Wallet / Settings Style) -->
    <div class="search-card">
      <div class="brand-badge" style="margin-bottom: 0.6rem;">
        <span class="dot"></span>
        <span>Customer Account & Wallet</span>
      </div>
      <h1 class="card-title" style="font-size: 2rem; margin-bottom: 0.35rem;">Order History & Invoice Lookup</h1>
      <p class="card-subtitle">
        Enter your billing email address or unique order reference number to view your past transactions and download receipts.
      </p>

      <form id="orderSearchForm" class="search-form-row">
        <input 
          type="text" 
          id="orderSearchInput" 
          class="search-input" 
          placeholder="Search by email, customer name, or order ref (ORD-...)"
          value=""
        >
        <button type="submit" class="btn-search-orders" id="btnSearch">
          <span>🔍</span> Search
        </button>
        <button type="button" class="btn-preset" id="btnClearSearch" style="display: none; padding: 0.75rem 1.25rem;">
          ✕ Clear
        </button>
      </form>

      <!-- Status Filter Segmented Controls -->
      <div class="catalog-filter-bar" style="margin-top: 1.5rem; justify-content: flex-start;">
        <button type="button" class="filter-chip active" data-status="ALL">All Statuses</button>
        <button type="button" class="filter-chip" data-status="COMPLETED">Completed</button>
        <button type="button" class="filter-chip" data-status="PENDING">Pending</button>
        <button type="button" class="filter-chip" data-status="CANCELLED">Cancelled</button>
      </div>
    </div>

    <!-- Results Count Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding: 0 0.5rem;">
      <span style="font-size: 0.88rem; color: var(--ios-label-secondary);" id="resultsCount">Loading order records...</span>
      <span style="font-size: 0.82rem; color: var(--ios-blue); font-weight: 600;" id="exchangeRateIndicator">Rate: 1 USD = 4,100 KHR</span>
    </div>

    <!-- Orders Cards Container -->
    <div id="ordersList">
      <!-- Injected dynamically by JavaScript -->
    </div>

  </main>

  <!-- Hidden Invoice Template for direct PDF downloads from Order History -->
  <div id="pdfDownloadHiddenContainer" style="display: none;">
    <div class="invoice-container" id="pdfTemplateCard" style="width: 700px; padding: 2rem;">
      <!-- Populated dynamically when download is clicked -->
    </div>
  </div>

  <!-- Apple Dynamic Island Toast Notification -->
  <div id="toastBox" class="toast-notification"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const KHR_RATE = 4100;
      let currentCurrency = localStorage.getItem('selected_currency') || 'USD';
      let currentStatusFilter = 'ALL';
      let allLoadedOrders = [];

      const searchForm = document.getElementById('orderSearchForm');
      const searchInput = document.getElementById('orderSearchInput');
      const ordersList = document.getElementById('ordersList');
      const resultsCount = document.getElementById('resultsCount');
      const filterChips = document.querySelectorAll('.filter-chip');
      const btnClearSearch = document.getElementById('btnClearSearch');
      const btnCurrUSD = document.getElementById('btnCurrUSD');
      const btnCurrKHR = document.getElementById('btnCurrKHR');
      const toastBox = document.getElementById('toastBox');

      function formatMoney(usdAmount, currency = currentCurrency) {
        const num = parseFloat(usdAmount) || 0;
        if (currency === 'KHR') {
          return `${Math.round(num * KHR_RATE).toLocaleString()} ៛`;
        } else {
          return `$${num.toFixed(2)} USD`;
        }
      }

      function setCurrency(currency) {
        currentCurrency = currency;
        localStorage.setItem('selected_currency', currency);

        if (currency === 'USD') {
          btnCurrUSD.classList.add('active');
          btnCurrKHR.classList.remove('active');
        } else {
          btnCurrKHR.classList.add('active');
          btnCurrUSD.classList.remove('active');
        }
        renderOrders();
      }

      btnCurrUSD.addEventListener('click', () => setCurrency('USD'));
      btnCurrKHR.addEventListener('click', () => setCurrency('KHR'));

      // Fetch orders from API (PostgreSQL database) and merge with locally cached checkout orders
      async function fetchOrders(query = '') {
        ordersList.innerHTML = '<div style="text-align: center; padding: 2.5rem; color: var(--ios-label-secondary);">Searching orders...</div>';

        let backendOrders = [];
        try {
          const endpoint = (query && query.trim() !== '')
            ? `/api/v1/payments/orders/lookup?query=${encodeURIComponent(query.trim())}`
            : '/api/v1/payments/orders/lookup';
          const res = await fetch(endpoint);
          if (res.ok) {
            backendOrders = await res.json();
          }
        } catch (e) {
          console.warn('Could not reach backend lookup:', e);
        }

        // Local storage orders (cached from checkout completion)
        let localOrders = [];
        try {
          localOrders = JSON.parse(localStorage.getItem('stripe_ec_user_orders') || '[]');
        } catch (e) {}

        // Filter out any legacy mock demo order references
        const MOCK_REFS = new Set(['ORD-20260918-A789B2', 'ORD-20260918-B114K9', 'ORD-20260917-P92031', 'ORD-20260916-C44102']);
        localOrders = localOrders.filter(o => o && o.orderReference && !MOCK_REFS.has(o.orderReference));

        // Combine all sources - backend database orders take highest priority
        const combinedMap = new Map();
        localOrders.forEach(o => {
          if (o && o.orderReference) {
            combinedMap.set(o.orderReference, o);
          }
        });
        backendOrders.forEach(o => {
          if (o && o.orderReference) {
            combinedMap.set(o.orderReference, o);
          }
        });

        let all = Array.from(combinedMap.values());

        // Apply client search query filter if provided
        if (query && query.trim() !== '') {
          const q = query.trim().toLowerCase();
          all = all.filter(o => 
            (o.orderReference && o.orderReference.toLowerCase().includes(q)) ||
            (o.customerEmail && o.customerEmail.toLowerCase().includes(q)) ||
            (o.customerName && o.customerName.toLowerCase().includes(q)) ||
            (o.description && o.description.toLowerCase().includes(q))
          );
        }

        // Sort latest first
        all.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

        allLoadedOrders = all;
        renderOrders();
      }

      function renderOrders() {
        ordersList.innerHTML = '';

        const filtered = allLoadedOrders.filter(o => {
          if (currentStatusFilter === 'ALL') return true;
          return o.status === currentStatusFilter;
        });

        resultsCount.textContent = `Showing ${filtered.length} order record(s)`;

        if (filtered.length === 0) {
          ordersList.innerHTML = `
            <div class="cart-empty-state" style="background: var(--glass-card); border-radius: var(--radius-xxl); border: 1px solid var(--glass-border); padding: 3rem 1.5rem;">
              <div class="cart-empty-icon">🔍</div>
              <h3 style="color: #fff; margin-bottom: 0.5rem; font-size: 1.3rem;">No Orders Found</h3>
              <p style="font-size: 0.9rem; color: var(--ios-label-secondary); margin-bottom: 1.5rem;">No transaction records match your search criteria.</p>
              <button type="button" class="btn-preset" onclick="document.getElementById('orderSearchInput').value=''; document.getElementById('btnSearch').click();">
                View All Orders
              </button>
            </div>
          `;
          return;
        }

        filtered.forEach(order => {
          const card = document.createElement('div');
          card.className = 'order-card';

          const isSubscription = order.paymentType === 'SUBSCRIPTION';
          const subStatus = order.subscriptionStatus || (isSubscription ? 'ACTIVE' : null);
          const statusClass = `status-${(order.status || 'PENDING').toLowerCase()}`;
          const dateStr = order.createdAt ? new Date(order.createdAt).toLocaleString() : 'Recent';
          const primaryAmount = formatMoney(order.amount, currentCurrency);
          const secondaryAmount = currentCurrency === 'USD' ? formatMoney(order.amount, 'KHR') : formatMoney(order.amount, 'USD');

          const subBadge = isSubscription
            ? `<span style="margin-left: 0.5rem; background: rgba(255, 214, 10, 0.15); border: 1px solid rgba(255, 214, 10, 0.4); color: #ffd60a; font-size: 0.72rem; padding: 0.2rem 0.55rem; border-radius: var(--radius-sm); font-weight: 700; letter-spacing: 0.03em;">🔁 DAILY RECURRING ($0.99/day)</span>`
            : '';

          const subStatusHtml = isSubscription
            ? `<div style="margin-top: 0.35rem; font-size: 0.82rem; font-weight: 700; color: ${subStatus === 'ACTIVE' ? 'var(--ios-green)' : '#ff453a'};">
                ${subStatus === 'ACTIVE' ? '● Active Subscription (Billed Daily at $0.99 USD)' : '✕ Daily Subscription Cancelled'}
               </div>`
            : '';

          const cancelSubBtn = (isSubscription && subStatus === 'ACTIVE')
            ? `<button type="button" class="btn-preset btn-cancel-sub" data-ref="${order.orderReference}" style="padding: 0.45rem 0.85rem; font-size: 0.82rem; background: rgba(255, 69, 58, 0.15); border-color: rgba(255, 69, 58, 0.35); color: #ff453a;">
                 ✕ Cancel Daily Plan
               </button>`
            : '';

          card.innerHTML = `
            <div class="order-card-header">
              <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 0.35rem;">
                <span class="order-ref-title">${order.orderReference}</span>
                ${subBadge}
                <div class="order-timestamp" style="width: 100%;">📅 ${dateStr}</div>
              </div>
              <span class="status-badge ${statusClass}">
                <span class="dot" style="width: 5px; height: 5px; border-radius: 50%; background: currentColor;"></span>
                ${order.status || 'COMPLETED'}
              </span>
            </div>

            <div class="order-card-body">
              <div class="order-details-col">
                <div>
                  <strong style="color: #ffffff; font-size: 1.05rem;">${order.description || (isSubscription ? 'VIP Engineering Daily Pass ($0.99/day)' : 'E-Commerce Purchase')}</strong>
                </div>
                ${subStatusHtml}
                <div style="color: var(--ios-label-secondary); font-size: 0.85rem; margin-top: 0.25rem;">
                  Customer: <span style="color: var(--ios-blue); font-weight: 600;">${order.customerName || 'Customer'}</span> (${order.customerEmail || 'N/A'})
                </div>
                <div style="color: var(--ios-label-tertiary); font-size: 0.8rem;">
                  Payment Method: <strong style="color: var(--ios-label-primary);">${order.paymentMethod || (isSubscription ? 'Stripe Daily Recurring' : (order.stripeSessionId ? 'Stripe Gateway' : 'Online Payment'))}</strong>
                </div>
              </div>

              <div class="order-actions-col">
                <div style="text-align: right;">
                  <div style="font-size: 1.35rem; font-weight: 800; color: var(--ios-green);">${primaryAmount}</div>
                  <div style="font-size: 0.78rem; color: var(--ios-label-tertiary);">${secondaryAmount}</div>
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; justify-content: flex-end;">
                  <a href="/success.html?order_ref=${order.orderReference}" class="btn-preset" style="padding: 0.45rem 0.85rem; font-size: 0.82rem; text-decoration: none;">
                    📄 View Receipt
                  </a>
                  <button type="button" class="btn-preset btn-quick-pdf" data-ref="${order.orderReference}" style="padding: 0.45rem 0.85rem; font-size: 0.82rem; background: rgba(10, 132, 255, 0.15); border-color: rgba(10, 132, 255, 0.3); color: var(--ios-blue);">
                    📥 PDF
                  </button>
                  ${cancelSubBtn}
                </div>
              </div>
            </div>
          `;

          // Quick PDF Download from order list
          card.querySelector('.btn-quick-pdf').addEventListener('click', () => {
            downloadPdfForOrder(order);
          });

          // Subscription cancellation button handler
          const cancelBtn = card.querySelector('.btn-cancel-sub');
          if (cancelBtn) {
            cancelBtn.addEventListener('click', async () => {
              const confirmMsg = `Are you sure you want to cancel your daily recurring subscription for ${order.orderReference} ($0.99/day)?\n\nStripe will immediately stop all recurring charges.`;
              if (!confirm(confirmMsg)) {
                return;
              }

              cancelBtn.disabled = true;
              cancelBtn.textContent = 'Cancelling...';

              try {
                const res = await fetch(`/api/v1/payments/subscriptions/${encodeURIComponent(order.orderReference)}/cancel`, {
                  method: 'POST'
                });
                const data = await res.json();

                if (res.ok) {
                  showToast(`Daily subscription for ${order.orderReference} successfully cancelled.`);
                  // Update locally cached order status if present
                  try {
                    const localOrders = JSON.parse(localStorage.getItem('stripe_ec_user_orders') || '[]');
                    const found = localOrders.find(o => o.orderReference === order.orderReference);
                    if (found) {
                      found.subscriptionStatus = 'CANCELLED';
                      localStorage.setItem('stripe_ec_user_orders', JSON.stringify(localOrders));
                    }
                  } catch (e) {}

                  // Refresh orders display
                  fetchOrders(searchInput.value.trim());
                } else {
                  showToast(data.message || 'Failed to cancel daily subscription.', true);
                  cancelBtn.disabled = false;
                  cancelBtn.textContent = '✕ Cancel Daily Plan';
                }
              } catch (err) {
                console.error('Cancellation error:', err);
                showToast('Unable to connect to payment server to cancel subscription.', true);
                cancelBtn.disabled = false;
                cancelBtn.textContent = '✕ Cancel Daily Plan';
              }
            });
          }

          ordersList.appendChild(card);
        });
      }

      // PDF Download generator for order card
      function downloadPdfForOrder(order) {
        showToast(`Preparing PDF invoice for ${order.orderReference}...`);
        const hiddenCard = document.getElementById('pdfTemplateCard');
        const hiddenContainer = document.getElementById('pdfDownloadHiddenContainer');
        hiddenContainer.style.display = 'block';

        const amountUsd = parseFloat(order.amount) || 0;
        const amountKhr = Math.round(amountUsd * 4100);

        hiddenCard.innerHTML = `
          <div class="invoice-header">
            <div>
              <div class="invoice-logo-title"><span>⚡</span> StripePay E-Commerce</div>
              <div class="invoice-company-info">
                Official Digital Store Receipt<br>
                Phnom Penh, Cambodia | Tax: KH-VAT-8841029
              </div>
            </div>
            <div class="invoice-meta">
              <div class="invoice-number">INV-${order.orderReference}</div>
              <div class="invoice-date">Date: ${order.createdAt ? new Date(order.createdAt).toLocaleDateString() : 'N/A'}</div>
              <div style="margin-top: 0.5rem;">
                <span class="status-badge status-completed">${order.status || 'COMPLETED'}</span>
              </div>
            </div>
          </div>
          <div class="invoice-parties-grid">
            <div>
              <div style="font-weight: 700; color: #475569; font-size: 0.8rem;">Billed To:</div>
              <div style="font-weight: 800; font-size: 1rem; color: #0f172a;">${order.customerName || 'Valued Customer'}</div>
              <div style="color: #64748b;">${order.customerEmail || 'N/A'}</div>
            </div>
            <div>
              <div style="font-weight: 700; color: #475569; font-size: 0.8rem;">Payment Details:</div>
              <div style="font-weight: 700;">${order.paymentMethod || 'Stripe / KHQR Gateway'}</div>
              <div style="color: #64748b; font-size: 0.78rem;">Order Ref: ${order.orderReference}</div>
            </div>
          </div>
          <table class="invoice-table">
            <thead>
              <tr>
                <th>Description</th>
                <th style="text-align: center;">Qty</th>
                <th style="text-align: right;">Total (USD)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>${order.description || (order.paymentType === 'SUBSCRIPTION' ? 'VIP Engineering Daily Pass (Daily Recurring Subscription - $0.99 / day)' : 'Engineering E-Book / Software')}</td>
                <td style="text-align: center;">1</td>
                <td style="text-align: right; font-weight: 700;">$${amountUsd.toFixed(2)}</td>
              </tr>
            </tbody>
          </table>
          <div class="invoice-totals-box">
            <div class="invoice-total-row">
              <span>Total Settled (USD):</span>
              <strong style="color: #0f172a;">$${amountUsd.toFixed(2)} USD</strong>
            </div>
            <div class="invoice-total-row" style="color: #059669; font-weight: 700;">
              <span>KHR Equivalent:</span>
              <span>${amountKhr.toLocaleString()} ៛</span>
            </div>
          </div>
        `;

        const opt = {
          margin: 10,
          filename: `Receipt-${order.orderReference}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(hiddenCard).save().then(() => {
          hiddenContainer.style.display = 'none';
          showToast(`Invoice downloaded: Receipt-${order.orderReference}.pdf`);
        }).catch(e => {
          hiddenContainer.style.display = 'none';
          console.error(e);
        });
      }

      // Status Filter Handlers
      filterChips.forEach(chip => {
        chip.addEventListener('click', () => {
          filterChips.forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentStatusFilter = chip.dataset.status;
          renderOrders();
        });
      });

      // Search Form Submit
      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        fetchOrders(searchInput.value.trim());
      });

      if (btnClearSearch) {
        btnClearSearch.addEventListener('click', () => {
          searchInput.value = '';
          btnClearSearch.style.display = 'none';
          fetchOrders('');
        });
      }

      searchInput.addEventListener('input', () => {
        if (btnClearSearch) {
          btnClearSearch.style.display = searchInput.value.trim() ? 'inline-flex' : 'none';
        }
      });

      function showToast(msg) {
        if (!toastBox) return;
        toastBox.textContent = msg;
        toastBox.classList.add('active');
        setTimeout(() => toastBox.classList.remove('active'), 3500);
      }

      // Initial Fetch - read URL query or order reference if present, or load all real database records
      setCurrency(currentCurrency);
      const urlParams = new URLSearchParams(window.location.search);
      const initialQuery = urlParams.get('query') || urlParams.get('order_ref') || '';
      if (initialQuery) {
        searchInput.value = initialQuery;
        if (btnClearSearch) btnClearSearch.style.display = 'inline-flex';
      }
      fetchOrders(initialQuery);
    });
  </script>

</body>
</html>
